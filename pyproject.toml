[project]
name = "dku2dbx"
version = "0.0.1"
description = "Usine de migration de projets Dataiku DSS vers Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlglot>=25.0",
    "networkx>=3.3",
    "jinja2>=3.1",
    "lark>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
dku2dbx = "dku2dbx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "syrupy>=4.6",
    "pyspark>=4.0,<5",
    "chispa>=0.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-networkx>=3.6.1.20261119",
    "types-pyyaml>=6.0",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dku2dbx"]

# The default scoring grid ships with the package (used when config/ is absent).
[tool.hatch.build.targets.wheel.force-include]
"config/scoring.yaml" = "dku2dbx/default_scoring.yaml"
"templates" = "dku2dbx/templates"

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004"]  # magic numbers: acceptable dans les tests et fixtures

[tool.ruff.lint.flake8-bugbear]
# typer declares parameters through default values (its documented style)
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915", "PLR0917"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: test qui nécessite PySpark et une JVM (Java 17+)",
]
